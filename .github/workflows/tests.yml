name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}\05_src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Compile Python sources
        run: python -m compileall -q 05_src 06_tests

      - name: Run calculation engine tests
        run: python -m unittest discover -s 06_tests -p "test_engine_*.py" -v

      - name: Run full test suite
        run: python -m unittest discover -s 06_tests -v
